{% extends 'base.html' %}

{% block content %}

<section class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-badge">BikeMart Login</span>
            <h1>Welcome Back</h1>
            <p>Login to manage bikes, customers, billing, employees and shop details.</p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <div class="auth-form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    id="username" 
                    placeholder="Enter username" 
                    required
                >
            </div>

            <div class="auth-form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    id="password" 
                    placeholder="Enter password" 
                    required
                >
            </div>

            <button type="submit" class="btn auth-btn">Login</button>
        </form>

        <div class="auth-footer">
            <p>
                Don’t have an account?
                <a href="{% url 'signup' %}">Signup here</a>
            </p>
        </div>
    </div>
</section>

{% endblock %}
