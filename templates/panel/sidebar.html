<div class="sidebar" id="adminSidebar">
    <button class="mobile-sidebar-close" type="button" id="sidebarCloseBtn">
        ✕
    </button>

    <h2>Admin Panel</h2>

    <a href="{% url 'admin_dashboard' %}">Dashboard</a>
    <a href="{% url 'bike_list' %}">Bike Details</a>
    <a href="{% url 'bill_payment_list' %}">Bill Payments</a>
    <a href="{% url 'customer_list' %}">Customer Details</a>
    <a href="{% url 'vendor_list' %}">Vendor Details</a>
    <a href="{% url 'employee_list' %}">Employee Details</a>
    <a href="{% url 'shop_settings_update' %}">Shop Settings</a>
    <a href="{% url 'user_list' %}">Users</a>
    <a href="{% url 'audit_log_list' %}">Audit Logs</a>
    <a href="{% url 'admin_logout' %}">Logout</a>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<button class="mobile-sidebar-toggle" type="button" id="sidebarToggleBtn">
    ☰
</button>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
        const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
        const adminSidebar = document.getElementById('adminSidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function openSidebar() {
            if (adminSidebar) {
                adminSidebar.classList.add('active');
            }

            if (sidebarOverlay) {
                sidebarOverlay.classList.add('active');
            }

            document.body.classList.add('sidebar-open');
        }

        function closeSidebar() {
            if (adminSidebar) {
                adminSidebar.classList.remove('active');
            }

            if (sidebarOverlay) {
                sidebarOverlay.classList.remove('active');
            }

            document.body.classList.remove('sidebar-open');
        }

        if (sidebarToggleBtn) {
            sidebarToggleBtn.addEventListener('click', openSidebar);
        }

        if (sidebarCloseBtn) {
            sidebarCloseBtn.addEventListener('click', closeSidebar);
        }

        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', closeSidebar);
        }

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeSidebar();
            }
        });
    });
</script>
